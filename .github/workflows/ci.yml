name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.15.0, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
      - run: npm run distribution:check -- --output "$RUNNER_TEMP/agentswitch-distribution"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentswitch-${{ github.sha }}-${{ runner.os }}-node-${{ matrix.node }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agentswitch-distribution/
          if-no-files-found: error
          retention-days: 14
