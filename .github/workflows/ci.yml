name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.15.0, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
      - run: npm run distribution:check -- --output "$RUNNER_TEMP/agentswitch-distribution"
      - uses: actions/upload-artifact@v4
        with:
          name: agentswitch-${{ github.sha }}-${{ runner.os }}-node-${{ matrix.node }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agentswitch-distribution/
          if-no-files-found: error
          retention-days: 14
  windows:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        node: [22.15.0, 22]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: agentswitch-${{ github.sha }}-Linux-node-22.15.0-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agentswitch-release
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify archive and run Windows console tests
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'agentswitch-release'
          $report = Get-Content (Join-Path $release 'result.json') -Raw | ConvertFrom-Json
          $env:AGENTSWITCH_WINDOWS_TARBALL = Join-Path $release $report.tarball
          $hash = (Get-FileHash $env:AGENTSWITCH_WINDOWS_TARBALL -Algorithm SHA256).Hash
          if ($hash -ne $report.sha256 -or $report.sourceCommit -ne $env:GITHUB_SHA) { throw 'Release artifact failed verification' }
          node --test test/cli.test.mjs test/update.test.mjs test/windows-smoke.mjs
